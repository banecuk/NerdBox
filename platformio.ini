; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ---------------------------------------------------------------------------
; Shared base — inherited by both debug and release environments.
; Do NOT add environment-specific settings here.
; ---------------------------------------------------------------------------
[env:base]
platform = espressif32
board = um_tinys3
framework = arduino
upload_port = COM[4-5]
upload_speed = 921600
monitor_port = COM[4]
monitor_speed = 115200
board_build.partitions = max_app_8MB.csv

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DARDUINO_USB_CDC_ON_BOOT
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-I src/

lib_deps =
	SPI
	WiFi
	lovyan03/LovyanGFX@^1.2.19
	bblanchon/ArduinoJson@^7.4.3

check_tool = cppcheck, clangtidy
check_flags =
    clangtidy: --format-style=file

; ---------------------------------------------------------------------------
; Debug — use during active development.
;   pio run -e WT32-SC01-PLUS-debug --target upload
;   pio device monitor
; DEBUG_MODE=1 enables verbose serial logging and disables optimisations.
; ---------------------------------------------------------------------------
[env:WT32-SC01-PLUS-debug]
extends = env:base
build_type = debug
test_ignore = * 
build_flags =
	${env:base.build_flags}
	-DDEBUG_MODE=1

; ---------------------------------------------------------------------------
; Release — use for flashing a finished / deployed device.
;   pio run -e WT32-SC01-PLUS-release --target upload
; DEBUG_MODE=0 compiles out all debug log calls. -O2 reduces draw-loop time.
; ---------------------------------------------------------------------------
[env:WT32-SC01-PLUS-release]
extends = env:base
build_type = release
test_ignore = * 
build_flags =
	${env:base.build_flags}
	-DDEBUG_MODE=0
	-O2

; ---------------------------------------------------------------------------
; Native — runs unit tests on your PC (no hardware needed).
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = googletest
build_flags =
    -std=c++17
    -I src/
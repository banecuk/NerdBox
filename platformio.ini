; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bare `pio run` only builds the two real firmware targets — not `native`
; (which fails hard against Arduino headers) and not `base` (not a real env).
default_envs = WT32-SC01-PLUS-debug, WT32-SC01-PLUS-release

; Abstract section (no `env:` prefix) — never built directly by PlatformIO,
; only pulled in via `extends`/`${base.*}` interpolation below.
[base]
platform = espressif32@7.0.1
board = um_tinys3
framework = arduino
upload_port = COM[4-5]
upload_speed = 921600
monitor_port = COM[4]
; Matches DebugImpl::kSerialBaudRate (AppConfig.h) — must stay in sync or the
; monitor reads garbage.
monitor_speed = 921600
board_build.partitions = max_app_8MB.csv
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
	-Wreorder
	-Wshadow
	-DARDUINO_USB_CDC_ON_BOOT
	-DBOARD_HAS_PSRAM
	-I src/
lib_deps =
	SPI
	WiFi
	ESPmDNS
	lovyan03/LovyanGFX@^1.2.25
	bblanchon/ArduinoJson@^7.4.3
check_tool = cppcheck, clangtidy
check_flags =
	clangtidy: --format-style=file

[env:WT32-SC01-PLUS-debug]
extends = base
build_type = debug
test_ignore = *
build_flags =
	${base.build_flags}
	-DDEBUG_MODE=1

[env:WT32-SC01-PLUS-release]
extends = base
build_type = release
test_ignore = *
build_flags =
	${base.build_flags}
	-DDEBUG_MODE=0
	-O2

[env:native]
platform = native
test_framework = googletest
test_build_src = true
build_src_filter =
	-<*>
	+<utils/ValueSmoother.cpp>
	+<utils/CalendarMath.cpp>
	+<services/pcMetrics/SseEventParser.cpp>
	+<services/pcMetrics/PcMetricsParser.cpp>
	+<services/pcMetrics/PcMetricsStreamService.cpp>
	+<services/processes/ProcessStreamService.cpp>
	+<services/roomClimate/RoomClimateMath.cpp>
	+<utils/ApplicationMetrics.cpp>
	+<utils/ActivityDetector.cpp>
	+<ui/widgets/base/MetricColorPolicy.cpp>
	+<ui/widgets/base/ThreadStaggerScheduler.cpp>
	+<network/UrlUtils.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
build_flags =
	-std=c++17
	-I test/native_stubs
	-I test/support
	-I src/
	-I src/utils
	-I src/services/pcMetrics
	-I src/services/processes
	-I src/ui/widgets/base
	-I src/network
